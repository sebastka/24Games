# Development: MariaDB for the shared high scores (the app runs with `npm run dev`, which reads .env):
#
#   docker compose up -d                       # MariaDB on 127.0.0.1:3306
#   docker compose --profile app up -d --build # MariaDB + the production image on http://localhost:8080
---
services:
  mariadb:
    image: mariadb:13.0
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: 24games
      MARIADB_USER: 24games
      MARIADB_PASSWORD: ${DB_PASSWORD:-24games}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-24games-root}
    ports:
      - '127.0.0.1:${DB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./dev/mariadb-init.sql:/docker-entrypoint-initdb.d/10-24games.sql:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    image: 24games:dev
    profiles: [app]
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PASSWORD: ${DB_PASSWORD:-24games}
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

volumes:
  mariadb-data:
