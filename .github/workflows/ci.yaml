---
name: CI

'on':
  push:
    branches: [master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, format, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # MariaDB for the high score store's integration tests (test/server-store.test.ts).
    services:
      mariadb:
        image: mariadb:13.0
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-root
      TEST_DB_NAME: games24_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: The committed assets are what the extraction produces
        run: |
          npm run assets
          git diff --exit-code --stat -- src/assets
          test -z "$(git status --porcelain -- src/assets)"
      - run: npm run build

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run yamllint==1.38.0 --strict .

  docker:
    runs-on: ubuntu-latest
    # Pulling Docker Hardened Images needs credentials, which forks do not get.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: 24games:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image without a database (read-only, no capability)
        run: |
          docker run -d --name web -p 8080:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges 24games:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/some/route | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy: default-src 'self'"
          bundle=$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -fsS "http://127.0.0.1:8080$bundle" | grep -q 'Bulldozer'
          # No database: the games keep their high scores themselves.
          curl -fsS http://127.0.0.1:8080/api/scores/cheesy | grep -q '"shared":false'
      - name: Smoke test the image with MariaDB (shared high scores)
        run: |
          docker network create games
          docker run -d --name db --network games -e MARIADB_DATABASE=24games -e MARIADB_USER=24games \
            -e MARIADB_PASSWORD=ci -e MARIADB_RANDOM_ROOT_PASSWORD=1 mariadb:11.4
          for _ in $(seq 1 60); do docker exec db healthcheck.sh --connect --innodb_initialized && break; sleep 1; done
          docker run -d --name web-db --network games -p 8081:8080 --read-only --cap-drop ALL \
            --security-opt no-new-privileges -e DB_HOST=db -e DB_PASSWORD=ci 24games:ci
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8081/api/health && break; sleep 1; done
          curl -fsS -X POST -H 'content-type: application/json' -H 'sec-fetch-site: same-origin' \
            -d '{"name":"CI","score":1234}' http://127.0.0.1:8081/api/scores/cheesy/1 | grep -q '"place":0'
          curl -fsS http://127.0.0.1:8081/api/scores/cheesy | grep -q '"name":"CI","score":"1234"'
      - name: Container logs
        if: always()
        run: |
          docker logs web || true
          docker logs web-db || true
