# nginx configuration of the 24games image: static files only.
# Everything nginx writes goes to /tmp, so the root filesystem can be read-only.

# Static files: two workers are plenty, whatever the host's core count.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
pcre_jit on;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        audio/wav wav;
    }

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 1k;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml audio/wav;

    server {
        listen 8080;
        root /usr/share/24games;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build output: cache forever.
        location /assets/ {
            include /etc/24games/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The single page (routes are #hashes); always revalidated, so a new release is picked
        # up on the next load.
        location / {
            include /etc/24games/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
